general {
  # Always ensure display exists before locking
  lock_cmd = pidof hyprlock || hyprlock --immediate-render

  # Sleep hook (don’t rely on listeners for this)
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd = hyprctl dispatch dpms on
}

listener { 
    timeout = 5
    on-timeout = brightnessctl --device="platform::kbd_backlight" set 0
    on-resume = brightnessctl --device="platform::kbd_backlight" set 1
    ignore_inhibit = true
}

listener {
  timeout = 250
  on-timeout = brightnessctl -s set 10%
  on-resume = brightnessctl -r
}

listener {
  timeout = 300
  on-timeout = loginctl lock-session
}


